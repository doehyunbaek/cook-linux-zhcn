name: Update patch dashboard

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect lore and docs-next status
        run: python scripts/update.py --verbose
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/status.json; then
            echo "Status is unchanged"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/status.json
          git commit -m "data: update patch status"
          git push

name: Update patch dashboard

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore generated status from data branch
        run: |
          if git fetch origin data; then
            git show origin/data:data/status.json > data/status.json
          else
            echo "No data branch yet; using the checked-in status"
          fi
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect lore and docs-next status
        run: python scripts/update.py --verbose
      - name: Publish site to data branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update patch status"
          fi
          git push --force-with-lease origin HEAD:data
